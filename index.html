<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction | Freeze Dried Pet Treats</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      background:
        linear-gradient(rgba(255,255,255,0.88), rgba(255,255,255,0.88)),
        url('https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
      color:#333;
    }

    .container{
      width:100%;
      max-width:720px;
      background:rgba(255,255,255,0.92);
      border-radius:28px;
      padding:50px 35px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.12);
      backdrop-filter:blur(10px);
    }

    .icon{
      width:100px;
      height:100px;
      margin:0 auto 25px;
      background:#fff3e8;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:48px;
      color:#ff7a00;
      box-shadow:0 8px 20px rgba(255,122,0,0.15);
    }

    h1{
      font-size:2.8rem;
      color:#ff7a00;
      margin-bottom:18px;
      font-weight:700;
    }

    .subtitle{
      font-size:1.1rem;
      line-height:1.9;
      color:#555;
      margin-bottom:35px;
    }

    .highlight{
      color:#ff7a00;
      font-weight:600;
    }

    .social-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:16px;
    }

    .social-btn{
      text-decoration:none;
      color:#fff;
      padding:16px;
      border-radius:16px;
      font-size:1rem;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      transition:all 0.3s ease;
    }

    .social-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 10px 20px rgba(0,0,0,0.15);
    }

    .shopee{
      background:#ee4d2d;
    }

    .lazada{
      background:linear-gradient(135deg,#4a00e0,#8e2de2);
    }

    .instagram{
      background:linear-gradient(
        45deg,
        #f58529,
        #feda77,
        #dd2a7b,
        #8134af,
        #515bd4
      );
    }

    .tiktok{
      background:#000;
    }

    footer{
      margin-top:35px;
      font-size:0.9rem;
      color:#888;
    }

    @media (max-width: 640px){

      .container{
        padding:40px 22px;
      }

      h1{
        font-size:2rem;
      }

      .subtitle{
        font-size:1rem;
      }

      .social-grid{
        grid-template-columns:1fr;
      }

      .social-btn{
        width:100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="icon">
      🐾
    </div>

    <h1>Website Under Construction</h1>

    <p class="subtitle">
      We’re preparing something pawsome for you! 🐶🐱<br><br>

      In the meantime, please find us on
      <span class="highlight">Shopee</span>,
      <span class="highlight">Lazada</span>,
      <span class="highlight">Instagram</span>, or
      <span class="highlight">TikTok</span>
      for your freeze dried treats & toppers purchase.
    </p>

    <div class="social-grid">

      <a href="https://shopee.sg/" target="_blank" class="social-btn shopee">
        <i class="fa-solid fa-bag-shopping"></i>
        Shopee
      </a>

      <a href="https://www.lazada.sg/" target="_blank" class="social-btn lazada">
        <i class="fa-solid fa-store"></i>
        Lazada
      </a>

      <a href="https://instagram.com/" target="_blank" class="social-btn instagram">
        <i class="fa-brands fa-instagram"></i>
        Instagram
      </a>

      <a href="https://tiktok.com/" target="_blank" class="social-btn tiktok">
        <i class="fa-brands fa-tiktok"></i>
        TikTok
      </a>

    </div>

    <footer>
      © 2026 MLEM @ eVok Foods 
    </footer>

  </div>

</body>
</html>
