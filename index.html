<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Construction | MLEM EvokFoods</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;
      padding:20px;
      color:#fff;
      background:#f5eee6;
    }

    /* Blurred Small Beige Dog Background */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(rgba(70,50,35,0.30), rgba(70,50,35,0.30)),
        url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1600&q=80');
      background-size:cover;
      background-position:center;
      filter:blur(10px) brightness(0.82);
      transform:scale(1.1);
      z-index:-2;
    }

    /* Soft warm overlay */
    body::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,248,240,0.12);
      z-index:-1;
    }

    .card{
      width:100%;
      max-width:720px;
      padding:55px 40px;
      border-radius:30px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.25);
      box-shadow:0 12px 40px rgba(0,0,0,0.20);
      text-align:center;
    }

     .icon{
      width:100px;
      height:100px;
      margin:0 auto 25px;
      background:#fff3e8;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:48px;
      color:#ff7a00;
      box-shadow:0 8px 20px rgba(255,122,0,0.15);
}
    h1{
      font-size:3rem;
      font-weight:700;
      margin-bottom:18px;
      letter-spacing:0.5px;
    }

    p{
      font-size:1.08rem;
      line-height:1.9;
      color:#fafafa;
      margin-bottom:38px;
      font-weight:300;
    }

    .highlight{
      color:#ffe1b5;
      font-weight:600;
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;
      padding:15px 30px;
      min-width:220px;
      border-radius:50px;
      font-size:1rem;
      font-weight:600;
      transition:all 0.3s ease;
    }

    .shopee{
      background:#ee4d2d;
      color:#fff;
      box-shadow:0 6px 18px rgba(238,77,45,0.35);
    }

    .shopee:hover{
      transform:translateY(-4px);
      background:#d94323;
    }

    .lazada{
      background:linear-gradient(90deg,#0f136d,#ff00a8);
      color:#fff;
      box-shadow:0 6px 18px rgba(255,0,168,0.30);
    }

    .lazada:hover{
      transform:translateY(-4px);
      opacity:0.94;
    }

    footer{
      margin-top:35px;
      font-size:0.9rem;
      color:#f2f2f2;
      font-weight:300;
    }

    /* Tablet */
    @media (max-width:768px){

      .card{
        padding:45px 28px;
      }

      h1{
        font-size:2.3rem;
      }

      p{
        font-size:1rem;
      }
    }

    /* Mobile */
    @media (max-width:480px){

      .card{
        padding:35px 22px;
      }

      h1{
        font-size:1.8rem;
      }

      .dog-icon{
        font-size:52px;
      }

      .btn{
        width:100%;
      }

      p{
        line-height:1.8;
      }
    }

  </style>
</head>

<body>

  <div class="card">

    
<div class="icon">
      🐾
    </div>

    <h1>Website Under Construction</h1>

    <p>
      We’re currently building something
      <span class="highlight">cute & pawsome!!</span>
      <br><br>
      In the meantime, please find us on
      <span class="highlight">Shopee</span> or
      <span class="highlight">Lazada</span>
      for your freeze-dried treats & toppers purchases.
    </p>

    <div class="buttons">

      <a href="https://shopee.sg/mlem21" target="_blank" class="btn shopee">
        Visit Our Shopee Store
      </a>

      <a href="https://www.lazada.sg/shop/mlem-evok-foods" target="_blank" class="btn lazada">
        Visit Our Lazada Store
      </a>

    </div>

    <footer>
      © 2026 MLEM @ eVokFoods. All Rights Reserved.
    </footer>

  </div>

</body>
</html>
